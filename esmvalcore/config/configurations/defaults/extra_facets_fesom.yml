# Extra facets for native FESOM model output

# Notes:
# - All facets can also be specified in the recipes. The values given here are
#   only defaults.
# - The facet ``var_type`` has to be specified in the recipe if it is not given
#   here and default DRS is used.

# A complete list of supported keys is given in the documentation (see
# ESMValCore/doc/quickstart/find_data.rst).
---
projects:
  FESOM:
    extra_facets:
      '*':
        # Cell measures
        areacella:
          latitude: grid_latitude
          longitude: grid_longitude
          raw_name: cell_area
        areacello:
          latitude: grid_latitude
          longitude: grid_longitude
          raw_name: cell_area

        # Variable names and units
        uo:
          raw_name: u
          raw_units: m/s
        vo:
          raw_name: v
          raw_units: m/s
        tos:
          raw_name: sst
          raw_units: degC
        zos:
          raw_name: ssh
          raw_units: m
        mlotst:
          raw_name: MLD1
          raw_unis: m
        thetao:
          raw_name: temp
          raw_units: degC
        so:
          raw_name: salt
          raw_units: '0.001'
        siconc:
            raw_name: aice
            raw_unis: '%'
